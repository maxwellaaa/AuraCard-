name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to attach Mac artifacts (empty to skip)
        required: false
        default: v1.0.1-2026-08-08
  push:
    branches: [master, main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder --mac --config electron-builder.yml --publish never

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraCard-mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach artifacts to GitHub Release
        if: ${{ steps.tag.outputs.name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
